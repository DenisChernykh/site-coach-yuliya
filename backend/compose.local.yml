name: coach-yuliya-local
services:
  postgres:
    image: postgres:18.4-trixie@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    environment:
      POSTGRES_DB: coach_yuliya
      POSTGRES_USER: coach_yuliya
      POSTGRES_PASSWORD: local-development-only
    ports:
      - '127.0.0.1:55438:5432'
    volumes:
      - coach-postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coach_yuliya -d coach_yuliya']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  coach-postgres:
networks:
  default:
    ipam:
      config:
        - subnet: 10.204.43.0/24
